# A full Kuma system definition. Every field the schema accepts appears
# here; the commented ones are optional and show their default.
schema_version = 1

[system]
# Unset (the default) kuma composes its own base from Fedora's package
# repos: Fedora's minimal bootc core (kernel, systemd, bootc, dnf) plus
# hardware enablement, and none of the general-purpose weight
# fedora-bootc carries. Set it to any bootc image reference to build
# FROM that instead: the escape hatch for debugging against
# fedora-bootc, a mirror, or a test tag.
# base = "quay.io/fedora/fedora-bootc:44"

# The composed base ships firmware for consumer hardware by default, so
# a machine boots with working GPU/wifi/audio without saying anything
# about itself. Name packages here to trim it to exactly your hardware
# (see `kuma schema` for the set); leave it alone for media other people
# will boot on machines you have never seen.
# firmware = ["amd-gpu-firmware", "amd-ucode-firmware", "mt7xxx-firmware"]

# A curated set kuma maintains, not a package list you assemble.
# "niri" (scrollable tiling) or "cosmic" (see cosmic.toml).
# Omit for a headless machine.
desktop = "niri"

# The login shell accounts on this machine get. Separate from
# [user].shell because that describes a person and this describes the
# image: media you hand to somebody declares no user, and without this
# an image that installs fish had no way to say to use it.
shell = "fish"

# Bootstrap Homebrew without declaring formulae, for ad-hoc use.
# A non-empty packages.brew implies this.
# brew = true

# Timezone and hostname are machine state: `timedatectl` and `hostnamectl`
# set them and they survive image updates. Pin them here only to force
# every machine built from this file to match. Unset, the hostname is
# "kuma" and `kuma vm` mirrors the host's timezone.
# timezone = "America/Denver"
# hostname = "kuma-laptop"

# Installs the matching glibc langpack and sets LANG.
# locale = "en_US.UTF-8"

# The primary account, created on first boot and converged on every boot
# after: shell, declared groups, and kuma-managed ssh keys.
#
# Commented out so this file is safe to build shareable media from.
# Declaring a user removes Anaconda's create-a-user screen, so an ISO
# built from a declaration that names one but sets no password_hash
# installs a machine whose only account is locked. Left undeclared,
# `kuma iso` lets Anaconda ask and the person gets their own account;
# `kuma iso --live` has no installer to ask, so media built from this
# file is for trying kuma rather than installing it. `kuma vm` needs
# nothing here either: it injects kuma/kuma into the disk it builds.
# Uncomment for a machine you are declaring for yourself.
# [user]
# name = "me"
# shell = "fish"

# From `kuma passwd`. Applies only at creation, so change the password on
# the machine afterward and kuma won't fight you.
# password_hash = '$6$...'

# groups = ["wheel"]                  # the default
# ssh_keys = ["ssh-ed25519 AAAA..."]  # served to sshd from /etc/kuma/keys
# autologin = true                    # straight to the desktop, no greeter

[packages]
# Baked into the image: changing this list needs a rebuild and a reboot.
rpm = ["fish", "git-core", "git-core-doc", "distrobox", "tailscale"]

# Flathub apps, converged on boot and daily: additions install, removals
# uninstall. Convergence only ever takes back what it installed, so an
# app you install yourself stays yours, from a store or the command line,
# and `kuma capture` offers to write it down here. Updates are not scoped
# that way: everything installed is kept current, declared or not.
flatpak = [
    "org.mozilla.firefox",
    "org.gnome.Loupe",
    "org.gnome.Calculator",
    "io.github.celluloid_player.Celluloid",
    "org.gnome.Papers",
    "org.gnome.TextEditor",
]

# CLI tools that move faster than a rebuild-and-reboot cycle. Converged
# like flatpaks; ad-hoc `brew install` stays yours, and `kuma capture`
# offers to write it down here when you decide to keep it.
brew = ["ripgrep", "fd", "jq", "gh", "lazygit", "btop"]

# Your additions only. A desktop already enables what it needs (greeter,
# firewalld, bluetooth, cups, avahi for .local names and driverless
# printing, chronyd), so those don't belong here. Unit names are checked
# at build time, so a typo fails the build instead of being ignored.
[services]
enable = ["tailscaled.service"]
# disable = ["mdmonitor.service"]   # e.g. a service for hardware you don't have

# Read-only btrfs snapshots of the state a rebuild can't restore. This
# file reproduces a system; it does not reproduce /var/home. Local only:
# it survives a bad update or a deleted directory, not a dead disk.
# A target that isn't a btrfs subvolume is skipped, not an error.
[snapshots]
enable = true
# target = "/var/home"   # snapshots land in <target>/.snapshots
# interval = "hourly"    # any systemd OnCalendar expression
# keep_recent = 24       # the newest N, whatever their age
# keep_daily = 7         # plus the newest from each of N further days

# Offsite copies of what [snapshots] keeps locally. Snapshots survive a
# mistake; this survives the disk. It reads from a read-only snapshot, so
# it needs [snapshots].enable and says so at `kuma check`.
#
# `secret` names the credential, it does not hold it: the value lives at
# /var/lib/kuma/secrets/<secret>.env, 0600 root, put there by hand. That
# keeps this file complete (a credential exists, it is called this) while
# keeping the value out of something committed and baked world-readable.
# `repo` carrying a password is refused for the same reason.
# [backup]
# enable = true
# repo = "s3:https://minio.example:9000/kuma"   # as restic spells it
# secret = "backup"      # /var/lib/kuma/secrets/backup.env
# interval = "daily"     # any systemd OnCalendar expression
# keep_daily = 7
# keep_weekly = 4
# keep_monthly = 6
# exclude = ["~/Videos"]   # on top of the curated set, never instead of it
#
# Wifi passwords are the one thing nothing else can recreate: not this
# file, which calls them out of scope, not the image, which ships that
# directory empty, and not home, since they live in /etc. Off by default
# because turning it on puts those passphrases in the repository, which
# is a decision rather than a default. `kuma doctor` says which way it is
# set, so an omission is something you read rather than discover.
# network_connections = false

# Certificate authorities to trust on top of the ones Fedora ships, keyed
# by the name each one gets on disk. The certificate goes in this file
# rather than beside it: a declaration that points at a path somewhere
# else is not one file any more, and a CA certificate is public, which is
# what makes that safe here and unsafe for anything in [user].
# [system.ca_certificates]
# "my-root-ca" = """
# -----BEGIN CERTIFICATE-----
# MIIBkTCB+wIJAKZ...
# -----END CERTIFICATE-----
# """

# Flatpak permission overrides, declared per app and converged per key.
# kuma sets the keys named here and copies every other line in the same
# file through untouched, so Flatseal stays the editor people reach for
# and this file stays the record. Applied at boot and by `kuma sync`, and
# deliberately not on the daily timer: an install arriving at a random
# hour is harmless, a permission changing under a running app is not.
#
# The shape is flatpak's own override file, so `flatpak override --show`
# round-trips into it.
# [overrides."org.mozilla.firefox"]
# scope = "system"                    # or "user"; system is where kuma installs apps
# filesystems = ["home", "!xdg-config/kitty"]   # "!" takes a permission away
# sockets = ["wayland", "!x11"]
# devices = ["dri"]
# shared = ["network"]
# features = ["devel"]
# persistent = [".mozilla"]
# environment = { MOZ_ENABLE_WAYLAND = "1" }
# session-bus = { "org.freedesktop.Flatpak" = "talk" }   # none, see, talk, or own
# system-bus = { "org.freedesktop.UPower" = "see" }
