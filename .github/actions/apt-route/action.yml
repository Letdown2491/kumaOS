name: route apt around the azure mirror
description: |
  The runner image's /etc/apt/apt-mirrors.txt points every apt source at
  azure.archive.ubuntu.com — a traffic-manager CNAME chain that is its own
  failure domain, and a sick one: Canonical's 2026-11-11 archive incident
  killed four CI rolls in ninety minutes with "Temporary failure resolving
  'azure.archive.ubuntu.com'" while the same name answered from off-Azure
  and the runners' other fetches (rustup, crates) sailed through. The
  mirror file is rewritten to the hosts behind the default road's own
  fallbacks — archive.ubuntu.com and security.ubuntu.com, different
  domains, different DNS — and apt carries on. Runs before every apt-get
  in this repo's workflows; a no-op when the azure road is healthy except
  for the seconds it costs.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        # Full URLs, scheme and all: the mirror method replaces the
        # mirror+file prefix with each line verbatim, and a line without
        # its scheme makes apt parse the host as the method ("the method
        # driver /usr/lib/apt/methods/archive.ubuntu.com/... could not
        # be found" — the first roll's own death, the azure file's
        # bare-host shape being schemeful or azure-steered somewhere
        # else). The lines are fallbacks apt tries in order (the
        # runner's deb822 sources point every suite at the one
        # mirror+file URI).
        #
        # kernel.org FIRST: Canonical's 2026-11-11 archive incident was
        # not one mirror's DNS but the runners' resolution of
        # Canonical-hosted names generally — azure's traffic-manager
        # chain died four rolls, and re-routing to archive/security
        # died the same death on a different Canonical name. mirrors
        # .kernel.org is kernel.org infrastructure: a different
        # organization, a different DNS path, every noble pocket
        # carried (verified 2026-11-11). The Canonical hosts stay as
        # fallbacks for the day kernel.org's mirror is the sick one.
        printf 'http://mirrors.kernel.org/ubuntu\nhttp://archive.ubuntu.com/ubuntu\nhttp://security.ubuntu.com/ubuntu\n' \
            | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
