name: kvm
description: >-
  Everything a job needs before it can boot a disk: qemu, cryptsetup,
  sshpass, UEFI firmware, and write access to /dev/kvm.

inputs:
  sshpass:
    description: "Install sshpass, for stages that log into an installed machine"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update -qq
        # xvfb is gone: the smoke's qemu runs egl-headless (no X server to
        # lose — the gtk-on-Xvfb pairing killed qemu three ways, measured
        # 2026-10-05). libegl1/libgl1 stay: egl-headless renders through
        # mesa's software path, and the runner image carries neither lib.
        # qemu-utils: qemu-nbd, which the boot stage uses to add the
        # console karg its QCOW2 needs. linux-modules-extra: the nbd and
        # vgem modules both live there, and the runner's azure kernel
        # ships without it (uname -r names the running flavor exactly).
        sudo apt-get install -y -qq qemu-system-x86 qemu-utils cryptsetup-bin ovmf \
            libegl1 libgl1 "linux-modules-extra-$(uname -r)" \
            ${{ inputs.sshpass == 'true' && 'sshpass' || '' }}
        # qemu-nbd needs the nbd module: the boot stage adds the console
        # karg to its disk through it. In modules-extra, which the 6.17
        # azure runner image ships without installing.
        sudo modprobe nbd max_part=8 || true

        # The guest's GL is virgl's, and virgl builds its host context
        # through a DRM render node. A runner has no GPU; vgem is the
        # no-hardware node provider. The 20261004 runner image (kernel
        # 6.17.0-1022-azure) dropped vgem from modules-extra — the Oct-3
        # image had a working node and every lap after the update died
        # at qemu's first line ("egl: no drm render node available") —
        # so when the module will not load, build it out of tree
        # against the running kernel's headers: vgem is one file, the
        # build takes seconds, and loading it needs no reboot. The same
        # trick WSL uses for the same reason.
        if ! ls /dev/dri/renderD* >/dev/null 2>&1; then
            sudo modprobe vgem 2>/dev/null || true
        fi
        if ! ls /dev/dri/renderD* >/dev/null 2>&1; then
            echo "   .. no render node and no vgem module; building vgem out of tree"
            sudo apt-get install -y -qq "linux-headers-$(uname -r)" build-essential
            vgem_dir=/tmp/vgem-build
            mkdir -p "$vgem_dir"
            # The sources are vendored in the repo (vgem/ next to this
            # action, torvalds/linux v6.17 verbatim): the fetch used to
            # be anonymous curl against raw.githubusercontent.com, and
            # GitHub rate-limits that (HTTP 429) from Actions egress —
            # the 2026-10-05 iso lap died on it. A repo-local copy has
            # no network to lose.
            cp "${{ github.action_path }}/vgem/"*.{c,h} "$vgem_dir/"
            if [ -f "$vgem_dir/vgem_drv.c" ]; then
                printf 'vgem-y := vgem_drv.o vgem_fence.o\nobj-m += vgem.o\n' > "$vgem_dir/Makefile"
                make -C "/lib/modules/$(uname -r)/build" M="$vgem_dir" modules -j4 -s \
                    && sudo insmod "$vgem_dir/vgem.ko" \
                    && echo "   .. vgem built and loaded"
            fi
        fi
        # A freshly insmod'd node ships 0600 root:root — devtmpfs's
        # default, and the runner's udev rules do not widen it — while
        # the smoke's qemu runs as this user, not root. An unopenable
        # node is indistinguishable from no node to qemu's scan: it
        # silently skips the EACCES and reports "no drm render node
        # available" (measured: reproduced locally, byte-identical, on
        # 2026-10-05). The /dev/kvm rule below is the same lesson.
        sudo chmod 666 /dev/dri/renderD* 2>/dev/null || true
        # The check is the qemu user's, not root's: ls sees a node root
        # owns, open is what qemu needs.
        node=""
        for candidate in /dev/dri/renderD*; do
            if [ -c "$candidate" ] && [ -r "$candidate" ] && [ -w "$candidate" ]; then
                node=$candidate
                break
            fi
        done
        if [ -z "$node" ]; then
            echo "no DRM render node the qemu user can open: the guest's GL (virgl) cannot initialize"
            exit 1
        fi
        echo "   .. render node: $node"

        # /dev/kvm is present on a hosted runner and the CPU exposes svm;
        # the runner user is simply not in the kvm group, and that is the
        # whole obstacle. Measured 2026-08-16, after "boot needs KVM so it
        # has to be local" had stood as an assumption for months.
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        # trigger queues the event and returns, so without settle this
        # races. One of three otherwise identical matrix jobs failed the
        # check below while the other two passed, which reads as flake and
        # is not.
        sudo udevadm settle

        # Loud here rather than as a confusing qemu error minutes later.
        test -w /dev/kvm || { echo "no write access to /dev/kvm"; exit 1; }

        # kuma install looks for its tools in fixed directories rather
        # than $PATH, because it runs under sudo, and the install script
        # it writes exports that same list as its PATH. A runner keeps
        # podman in /usr/local/bin, which TOOL_DIRS covers. Checked here
        # so a move is a five-second failure with a clear cause rather
        # than a refused install after a two-gigabyte pull.
        echo "podman resolves to: $(command -v podman)"
        for d in /usr/local/bin /usr/local/sbin /usr/bin /usr/sbin /bin /sbin; do
          [ -x "$d/podman" ] && echo "the install preflight will find $d/podman" && exit 0
        done
        echo "podman is outside TOOL_DIRS; kuma install would refuse"
        exit 1
