# Publish the niri image when a release tag lands.
#
# The other half of "a tag is a release trigger". release.yml cuts the
# release page; this publishes the image the release page describes —
# and the ordering matters in one direction only: until the leg is
# green, `kuma upgrade --check` on the previous release reports
# "current" forever, and an ISO installed in the meantime strands its
# machine on the release lane. A red leg here is a red release: the
# moving tags have not moved (publish.yml promotes only after its own
# validation laps), and the run fails with the failed leg's URL.
#
# Why only niri: the registry's own history. Every version ghcr has
# ever carried is `niri` / `niri-<version>` — no cosmic tag of any kind
# has ever existed, so no machine could be on one, and the tag road
# publishes the tier machines actually run. Publishing a first-ever
# cosmic image — a tier that has never been through this road, composed
# from a declaration no publish has ever validated — is not something a
# tag push should decide unattended. When that day comes, the tier
# returns here: append it to the loop below and the road carries it,
# signed and lap-proven like niri.
#
# Why dispatch instead of an `on: push: tags:` block in publish.yml
# itself: publish.yml is one image per run — a structure whose step
# bodies carry the staging/prove/promote history of three failed
# publishes — and the tag road keeps that file byte-identical, calling
# the proven pipeline rather than forking it. A one-off re-publish of a
# tier (cosmic included, when wanted) stays a manual dispatch of
# publish.yml exactly as it was.
#
# A leg is frozen at the tag's code: this workflow dispatches each leg
# with `--ref $TAG`, so the leg runs the tag's own publish.yml, and any
# workflow-only repair that lands on main after the cut never applies
# to it. The recovery for a red leg is a manual dispatch of publish.yml
# from MAIN, never from this tag — a re-run here re-dispatches from the
# same frozen code and fails the same way. The consequence is that this
# run's badge stays red regardless of the release's fate: a release
# that promoted through a hand-dispatched leg still shows a red badge
# on its tag (v44.10.0's stayed red through a successful attempt-2
# re-run). The badge describes the run, not the artifact; the source of
# truth an auditor should verify is the registry state itself — the
# pinned, digest-addressed image and its cosign signature — not this
# run's color.
#
# The legs run sequentially because the run-matching is honest that
# way: `gh run list` cannot show a run's inputs, so "the newest
# matching run is the one I just dispatched" needs one leg in flight
# at a time. It is also gentler on the validation battery, which is
# the long half of a leg.
#
# release.yml fires on the same tag push and runs in parallel; the two
# share nothing. Its ISO is composed from this tree by the packaged
# kuma, not pulled from the registry, so it neither waits for these
# publishes nor makes them wait for it.
name: publish-tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  # workflow_dispatch by API, and run watch/list to report the legs.
  actions: write

# One release's publish road at a time. A second tag while one battery
# is running queues behind it: two concurrent promotes could race the
# moving tags, and the queue is the only thing standing between them.
concurrency:
  group: publish-tag
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Same guard as release.yml's, for the same reason: a tag that
      # disagrees with Cargo.toml would publish an image whose own
      # --version contradicts the release it sits in.
      - name: guard the tag
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}" >&2
            exit 1
          fi

      # One leg per tier, signed always: the tag road passes no
      # allow_unsigned, so publish.yml's own require-a-key guard holds.
      # A leg's run is matched by the tag's commit and the dispatch
      # window — the newest run created after this leg started is this
      # leg's, because the legs are sequential and a queued older run
      # was created before the window opened.
      - name: publish niri, watching to green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          # ~40 minutes of build+compose+validate per leg on a good day;
          # the deadline names the failure before the 6-hour job
          # ceiling turns it into a mystery.
          leg_deadline=5400

          wait_green() {
            local example=$1 started=$2
            local run_id=""
            for _ in $(seq 1 12); do
              run_id=$(gh run list --workflow=publish.yml --event=workflow_dispatch \
                --created=">${started}" --limit 5 --json databaseId,headSha \
                --jq "[.[] | select(.headSha == \"${sha}\")][0].databaseId" 2>/dev/null || true)
              if [ -n "$run_id" ]; then break; fi
              sleep 15
            done
            if [ -z "$run_id" ]; then
              echo "::error::the ${example} leg never registered a run on ${sha}; nothing was promoted" >&2
              exit 1
            fi
            echo "the ${example} leg: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
            # The run's terminal verdict, read fresh: prints "true" or
            # "false" once the run is completed, nothing while it is
            # still going (including a re-run, which resets an ended
            # run to in_progress).
            leg_green() {
              gh run view "$run_id" --json status,conclusion \
                --jq 'if .status == "completed" then (.conclusion == "success") else empty end' 2>/dev/null
            }
            if timeout "$leg_deadline" gh run watch "$run_id" --interval 60 --exit-status; then
              echo "- \`${example}\`: [run ${run_id}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id})" \
                >> "$GITHUB_STEP_SUMMARY"
              return 0
            fi
            # The watch exits on the conclusion it watched — which can
            # be a failed attempt that has since been re-run (v44.10.0
            # paid this: the watch declared the leg dead on attempt 1's
            # conclusion, the re-run promoted 31 minutes later, and the
            # badge stayed red on a shipped release). The leg's verdict
            # is the run's terminal conclusion, not the watch's exit,
            # so read it back before declaring anything. A leg that
            # failed for good answers completed/false on the first
            # poll; a re-run in flight keeps the poll alive within the
            # same deadline the watch had.
            local waited=0 verdict
            while [ "$waited" -lt "$leg_deadline" ]; do
              verdict=$(leg_green || true)
              if [ -n "$verdict" ]; then
                if [ "$verdict" = "true" ]; then
                  echo "the ${example} leg: green on a re-run of ${run_id}; the watch exited on the failed attempt" >&2
                  echo "- \`${example}\`: [run ${run_id}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}) (green on a re-run; the watch exited on the failed attempt)" \
                    >> "$GITHUB_STEP_SUMMARY"
                  return 0
                fi
                break
              fi
              sleep 60
              waited=$((waited + 60))
            done
            echo "::error::the ${example} leg failed (run ${run_id}). The moving tags did not move: publish.yml promotes only after its validation laps, and a red lap leaves the tags on the last image that booted. Fix, then re-dispatch publish.yml for this tier by hand — from main, not from this tag: a leg runs this tag's own workflow code, so fixes that landed after the cut never apply to it, and this run's badge stays red regardless of the release's fate." >&2
            exit 1
          }

          {
            echo "### Published \`${TAG}\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          # niri only — see the header. The loop shape stays: a leg's
          # matching-window bookkeeping is identical per tier, and the
          # day cosmic (or any tier) earns a publish, its name joins
          # this list and nothing else changes.
          for example in niri; do
            started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            gh workflow run publish.yml --ref "$TAG" -f "example=${example}"
            wait_green "$example" "$started"
          done
