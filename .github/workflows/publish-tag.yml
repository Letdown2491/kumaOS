# Publish both release tiers when a release tag lands.
#
# The other half of "a tag is a release trigger". release.yml cuts the
# release page; this publishes the images the release page describes —
# and the ordering matters in one direction only: until both legs are
# green, `kuma upgrade --check` on the previous release reports
# "current" forever, and an ISO installed in the meantime strands its
# machine on the release lane. A red leg here is a red release: the
# moving tags have not moved (publish.yml promotes only after its own
# validation laps), and the run fails with the failed leg's URL.
#
# Why dispatch instead of an `on: push: tags:` block in publish.yml
# itself: a release is TWO images (niri and cosmic), and publish.yml
# is one image per run — a structure whose step bodies carry the
# staging/prove/promote history of three failed publishes. The
# dispatcher loops the proven pipeline per tier and keeps that file
# byte-identical; a one-off re-publish of a single tier stays a manual
# dispatch of publish.yml exactly as it was.
#
# The legs run sequentially because the run-matching is honest that
# way: `gh run list` cannot show a run's inputs, so "the newest
# matching run is the one I just dispatched" needs one leg in flight
# at a time. It is also gentler on the validation batteries, which are
# the long half of each leg.
#
# release.yml fires on the same tag push and runs in parallel; the two
# share nothing. Its ISO is composed from this tree by the packaged
# kuma, not pulled from the registry, so it neither waits for these
# publishes nor makes them wait for it.
name: publish-tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  # workflow_dispatch by API, and run watch/list to report the legs.
  actions: write

# One release's publish road at a time. A second tag while one battery
# is running queues behind it: two concurrent promotes could race the
# moving tags, and the queue is the only thing standing between them.
concurrency:
  group: publish-tag
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Same guard as release.yml's, for the same reason: a tag that
      # disagrees with Cargo.toml would publish an image whose own
      # --version contradicts the release it sits in.
      - name: guard the tag
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}" >&2
            exit 1
          fi

      # One leg per tier, signed always: the tag road passes no
      # allow_unsigned, so publish.yml's own require-a-key guard holds.
      # A leg's run is matched by the tag's commit and the dispatch
      # window — the newest run created after this leg started is this
      # leg's, because the legs are sequential and a queued older run
      # was created before the window opened.
      - name: publish each tier, watching to green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          # ~40 minutes of build+compose+validate per leg on a good day;
          # the deadline names the failure before the 6-hour job
          # ceiling turns it into a mystery.
          leg_deadline=5400

          wait_green() {
            local example=$1 started=$2
            local run_id=""
            for _ in $(seq 1 12); do
              run_id=$(gh run list --workflow=publish.yml --event=workflow_dispatch \
                --created=">${started}" --limit 5 --json databaseId,headSha \
                --jq "[.[] | select(.headSha == \"${sha}\")][0].databaseId" 2>/dev/null || true)
              if [ -n "$run_id" ]; then break; fi
              sleep 15
            done
            if [ -z "$run_id" ]; then
              echo "::error::the ${example} leg never registered a run on ${sha}; nothing was promoted" >&2
              exit 1
            fi
            echo "the ${example} leg: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
            if ! timeout "$leg_deadline" gh run watch "$run_id" --interval 60 --exit-status; then
              echo "::error::the ${example} leg failed (run ${run_id}). The moving tags did not move: publish.yml promotes only after its validation laps, and a red lap leaves the tags on the last image that booted. Fix, then re-dispatch publish.yml for this tier by hand, or cut the tag again." >&2
              exit 1
            fi
            echo "- \`${example}\`: [run ${run_id}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id})" \
              >> "$GITHUB_STEP_SUMMARY"
          }

          {
            echo "### Published \`${TAG}\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          for example in niri cosmic; do
            started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            gh workflow run publish.yml --ref "$TAG" -f "example=${example}"
            wait_green "$example" "$started"
          done
